
<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Estructura cristalina del diamante | Química3D</title>

<script src="https://3Dmol.org/build/3Dmol-min.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
    background: #ffffff;
    overflow: hidden;
}

#viewer {
    width: 100%;
    height: 100vh;
    position: relative;
}

.titulo {
    position: fixed;
    top: 18px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    text-align: center;
    width: 90%;
    pointer-events: none;
}

.titulo h1 {
    font-size: 21px;
    font-weight: 500;
    color: #333333;
    margin: 0;
}

.titulo p {
    font-size: 13px;
    color: #777777;
    margin-top: 7px;
}

.leyenda {
    position: fixed;
    top: 95px;
    left: 22px;
    z-index: 10;
    background: rgba(255,255,255,0.94);
    padding: 13px 16px;
    border-radius: 12px;
    box-shadow: 0 3px 14px rgba(0,0,0,0.08);
    font-size: 13px;
    color: #444444;
}

.item-leyenda {
    display: flex;
    align-items: center;
    gap: 9px;
    margin: 6px 0;
}

.esfera {
    width: 13px;
    height: 13px;
    border-radius: 50%;
    background: #777777;
    border: 1px solid #555555;
}

.linea {
    width: 19px;
    height: 4px;
    background: #555555;
    border-radius: 3px;
}

.celda {
    width: 19px;
    height: 4px;
    background: #D62828;
    border-radius: 3px;
}

.controles {
    position: fixed;
    bottom: 35px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 10px;
    z-index: 10;
    justify-content: center;
    width: 95%;
}

button {
    border: none;
    border-radius: 9px;
    padding: 11px 17px;
    background: #2E5EAA;
    color: white;
    font-size: 13px;
    cursor: pointer;
    transition: background 0.2s;
}

button:hover {
    background: #244b89;
}

.firma {
    position: fixed;
    bottom: 12px;
    right: 18px;
    font-size: 11px;
    color: #999999;
    z-index: 10;
}

@media (max-width: 600px) {
    .titulo h1 {
        font-size: 17px;
    }

    .leyenda {
        top: 85px;
        left: 10px;
        padding: 9px 11px;
        font-size: 11px;
    }

    button {
        padding: 10px 12px;
        font-size: 12px;
    }

    .controles {
        bottom: 35px;
        gap: 7px;
    }
}
</style>
</head>

<body>

<div id="viewer"></div>

<div class="titulo">
    <h1>Estructura covalente del diamante</h1>
    <p>Red cristalina cúbica tipo diamante · Carbono (C)</p>
</div>

<div class="leyenda">
    <div class="item-leyenda">
        <span class="esfera"></span>
        <span>Carbono (C)</span>
    </div>

    <div class="item-leyenda">
        <span class="linea"></span>
        <span>Enlace covalente</span>
    </div>

    <div class="item-leyenda">
        <span class="celda"></span>
        <span>Celda unidad</span>
    </div>
</div>

<div class="controles">
    <button id="botonCelda">Ocultar celda unidad</button>
    <button id="botonRotacion">Activar rotación</button>
</div>

<div class="firma">
    Química3D · Juana Mª Corrales
</div>

<script>

const elemento = document.getElementById("viewer");

const viewer = $3Dmol.createViewer(elemento, {
    backgroundColor: "white",
    antialias: true
});

// Parámetro de red del diamante (Å)
const a = 3.567;

// Distancia entre carbonos enlazados (Å)
const distanciaEnlace = Math.sqrt(3) * a / 4;

// Base de la estructura cúbica tipo diamante
const baseFCC = [
    [0, 0, 0],
    [0, 0.5, 0.5],
    [0.5, 0, 0.5],
    [0.5, 0.5, 0]
];

// Segunda posición de la base: desplazamiento (1/4, 1/4, 1/4)
const baseDiamante = [];

baseFCC.forEach(posicion => {
    baseDiamante.push(posicion);

    baseDiamante.push([
        posicion[0] + 0.25,
        posicion[1] + 0.25,
        posicion[2] + 0.25
    ]);
});

// Generar los átomos de las celdas próximas
const atomos = [];
const posicionesUnicas = new Set();

const limite = a / 2 + distanciaEnlace + 0.05;

for (let i = -1; i <= 1; i++) {
    for (let j = -1; j <= 1; j++) {
        for (let k = -1; k <= 1; k++) {

            baseDiamante.forEach(posicion => {

                const x = (i + posicion[0] - 0.5) * a;
                const y = (j + posicion[1] - 0.5) * a;
                const z = (k + posicion[2] - 0.5) * a;

                if (
                    Math.abs(x) <= limite &&
                    Math.abs(y) <= limite &&
                    Math.abs(z) <= limite
                ) {

                    const clave = [
                        x.toFixed(4),
                        y.toFixed(4),
                        z.toFixed(4)
                    ].join(",");

                    if (!posicionesUnicas.has(clave)) {
                        posicionesUnicas.add(clave);

                        atomos.push({x, y, z});
                    }
                }
            });
        }
    }
}

// Crear el modelo de átomos de carbono
const modelo = viewer.addModel();

const datosAtomos = atomos.map((posicion, indice) => ({
    elem: "C",
    atom: "C",
    serial: indice + 1,
    x: posicion.x,
    y: posicion.y,
    z: posicion.z
}));

modelo.addAtoms(datosAtomos);

// Todos los carbonos tienen exactamente el mismo aspecto
modelo.setStyle({}, {
    sphere: {
        color: "#777777",
        radius: 0.34,
        opacity: 1
    }
});

// Crear los enlaces covalentes
const enlaces = viewer.addShape({
    color: "#555555"
});

const distanciaCuadrada = distanciaEnlace * distanciaEnlace;

for (let i = 0; i < atomos.length; i++) {
    for (let j = i + 1; j < atomos.length; j++) {

        const dx = atomos[i].x - atomos[j].x;
        const dy = atomos[i].y - atomos[j].y;
        const dz = atomos[i].z - atomos[j].z;

        const d2 = dx * dx + dy * dy + dz * dz;

        if (Math.abs(d2 - distanciaCuadrada) < 0.001) {

            enlaces.addCylinder({
                start: {
                    x: atomos[i].x,
                    y: atomos[i].y,
                    z: atomos[i].z
                },
                end: {
                    x: atomos[j].x,
                    y: atomos[j].y,
                    z: atomos[j].z
                },
                radius: 0.075,
                color: "#555555",
                fromCap: 1,
                toCap: 1
            });
        }
    }
}

// Crear la celda unidad cúbica
const modeloCelda = viewer.addShape({
    color: "#D62828"
});

const h = a / 2;
const esquinas = [];

for (let x of [-h, h]) {
    for (let y of [-h, h]) {
        for (let z of [-h, h]) {
            esquinas.push({x, y, z});
        }
    }
}

// Dibujar las 12 aristas de la celda
esquinas.forEach(p1 => {
    esquinas.forEach(p2 => {

        const diferencias = [
            Math.abs(p1.x - p2.x),
            Math.abs(p1.y - p2.y),
            Math.abs(p1.z - p2.z)
        ];

        const cambios = diferencias.filter(d => d > 0.001);

        if (cambios.length === 1) {

            modeloCelda.addCylinder({
                start: p1,
                end: p2,
                radius: 0.045,
                color: "#D62828",
                fromCap: 1,
                toCap: 1
            });
        }
    });
});

// Ajustes de visualización
viewer.zoomTo();
viewer.zoom(1.35);
viewer.render();

// Mostrar u ocultar la celda unidad
let mostrarCelda = true;

document.getElementById("botonCelda").addEventListener("click", function() {

    mostrarCelda = !mostrarCelda;

    modeloCelda.hidden = !mostrarCelda;

    this.textContent = mostrarCelda
        ? "Ocultar celda unidad"
        : "Mostrar celda unidad";

    viewer.render();
});

// Activar o desactivar rotación
let rotando = false;

document.getElementById("botonRotacion").addEventListener("click", function() {

    rotando = !rotando;

    if (rotando) {
        viewer.spin("y", 0.35);
        this.textContent = "Detener rotación";
    } else {
        viewer.spin(false);
        this.textContent = "Activar rotación";
    }
});

// Adaptación al tamaño de pantalla
window.addEventListener("resize", function() {
    viewer.resize();
    viewer.render();
});

</script>

</body>
</html>
