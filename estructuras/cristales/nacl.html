
<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cloruro de sodio | Química3D</title>

<script src="https://3Dmol.org/build/3Dmol-min.js"></script>

<style>

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: white;
    font-family: Arial, Helvetica, sans-serif;
}

#viewer {
    width: 100%;
    height: 100vh;
}

.titulo {
    position: fixed;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(255,255,255,.93);
    padding: 9px 18px;
    border-radius: 10px;
    font-size: 20px;
    font-weight: bold;
    box-shadow: 0 2px 6px rgba(0,0,0,.15);
    z-index: 1000;
    white-space: nowrap;
}

.leyenda {
    position: fixed;
    top: 75px;
    left: 15px;
    background: rgba(255,255,255,.94);
    padding: 12px 15px;
    border-radius: 10px;
    box-shadow: 0 2px 6px rgba(0,0,0,.12);
    font-size: 13px;
    z-index: 1000;
    line-height: 2;
}

.color {
    display: inline-block;
    width: 13px;
    height: 13px;
    border-radius: 50%;
    margin-right: 7px;
    vertical-align: middle;
}

.na { background: #7658C8; }
.cl { background: #54A6C5; }

.controles {
    position: fixed;
    bottom: 18px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 1000;
    display: flex;
    gap: 8px;
}

button {
    border: none;
    border-radius: 8px;
    padding: 9px 15px;
    background: #315F9E;
    color: white;
    cursor: pointer;
    font-size: 13px;
}

button:hover {
    background: #244879;
}

.credito {
    position: fixed;
    bottom: 12px;
    right: 12px;
    padding: 6px 10px;
    background: rgba(255,255,255,.9);
    border-radius: 8px;
    text-decoration: none;
    color: #666;
    font-size: 12px;
    box-shadow: 0 2px 6px rgba(0,0,0,.15);
    z-index: 1000;
}

.credito:hover {
    color: #8a6fd1;
}

@media(max-width:600px) {

    .titulo {
        font-size: 17px;
    }

    .controles {
        bottom: 65px;
    }

    button {
        padding: 9px 11px;
        font-size: 12px;
    }

    .credito {
        font-size: 10px;
    }

}

</style>

</head>

<body>

<div class="titulo">
Cloruro de sodio (NaCl)
</div>

<div class="leyenda">

<strong>Leyenda</strong><br>

<span class="color na"></span> Na⁺ · Sodio<br>

<span class="color cl"></span> Cl⁻ · Cloruro<br>

▢ Celda unidad

</div>

<div id="viewer"></div>

<div class="controles">

<button id="rotacion">
⏸ Detener giro
</button>

<button id="celda">
Ocultar celda unidad
</button>

</div>

<a class="credito"
href="https://jmcorrales3d.github.io/quimica3D/"
target="_blank">

Química3D · Juana Mª Corrales

</a>


<script>

// ======================================
// 1. CREAR VISOR
// ======================================

const viewer = $3Dmol.createViewer("viewer", {
    backgroundColor: "white"
});

const a = 5.64;


// ======================================
// 2. POSICIONES CRISTALOGRÁFICAS
// ======================================

// Cl-: posiciones de la red CFC

const cloro = [
    [0,0,0],
    [0,0.5,0.5],
    [0.5,0,0.5],
    [0.5,0.5,0]
];

// Na+: posiciones octaédricas

const sodio = [
    [0.5,0,0],
    [0,0.5,0],
    [0,0,0.5],
    [0.5,0.5,0.5]
];


// ======================================
// 3. CONSTRUIR MODELO DE IONES
// ======================================

let atomos = [];

for (let i = -1; i <= 1; i++) {
    for (let j = -1; j <= 1; j++) {
        for (let k = -1; k <= 1; k++) {

            cloro.forEach(p => {

                atomos.push({
                    elemento: "Cl",
                    x: (i+p[0])*a,
                    y: (j+p[1])*a,
                    z: (k+p[2])*a
                });

            });

            sodio.forEach(p => {

                atomos.push({
                    elemento: "Na",
                    x: (i+p[0])*a,
                    y: (j+p[1])*a,
                    z: (k+p[2])*a
                });

            });

        }
    }
}


// Crear archivo XYZ en memoria

let xyz = atomos.length + "\n";
xyz += "Red cristalina de cloruro de sodio\n";

atomos.forEach(atomo => {

    xyz += `${atomo.elemento} ${atomo.x} ${atomo.y} ${atomo.z}\n`;

});


// Añadir modelo al visor

const modeloIones = viewer.addModel(xyz, "xyz");

// Estilo de los iones

modeloIones.setStyle(
    {elem: "Na"},
    {
        sphere: {
            radius: 0.78,
            color: "#7658C8"
        }
    }
);

modeloIones.setStyle(
    {elem: "Cl"},
    {
        sphere: {
            radius: 1.15,
            color: "#54A6C5"
        }
    }
);


// ======================================
// 4. CELDA UNIDAD INDEPENDIENTE
// ======================================

const esquinas = [
    [0,0,0],
    [a,0,0],
    [a,a,0],
    [0,a,0],
    [0,0,a],
    [a,0,a],
    [a,a,a],
    [0,a,a]
];

const aristas = [
    [0,1],[1,2],[2,3],[3,0],
    [4,5],[5,6],[6,7],[7,4],
    [0,4],[1,5],[2,6],[3,7]
];


// Crear modelo independiente para el cubo

function crearCelda() {

    let pdb = "";

    esquinas.forEach((p, i) => {

        const serial = String(i+1).padStart(5," ");

        const x = (p[0]*10).toFixed(3).padStart(8," ");
        const y = (p[1]*10).toFixed(3).padStart(8," ");
        const z = (p[2]*10).toFixed(3).padStart(8," ");

        pdb += `HETATM${serial}  C   CEL A   1    ${x}${y}${z}  1.00  0.00           C\n`;

    });

    aristas.forEach(e => {

        const n1 = String(e[0]+1).padStart(5," ");
        const n2 = String(e[1]+1).padStart(5," ");

        pdb += `CONECT${n1}${n2}\n`;

    });

    pdb += "END\n";

    const modeloCelda = viewer.addModel(pdb, "pdb");

    modeloCelda.setStyle({}, {
        line: {
            color: "#888888",
            linewidth: 2
        }
    });

    return modeloCelda;

}


// Guardar referencia del cubo

let modeloCelda = crearCelda();

let mostrarCelda = true;


// ======================================
// 5. AJUSTAR VISOR
// ======================================

viewer.zoomTo();

viewer.render();


// ======================================
// 6. ROTACIÓN AUTOMÁTICA
// ======================================

let girando = true;

viewer.spin("y", 0.5);

document.getElementById("rotacion").onclick = function() {

    if (girando) {

        viewer.spin(false);

        this.textContent = "▶ Reanudar giro";

    } else {

        viewer.spin("y", 0.5);

        this.textContent = "⏸ Detener giro";

    }

    girando = !girando;

};


// ======================================
// 7. MOSTRAR / OCULTAR CELDA
// ======================================

document.getElementById("celda").onclick = function() {

    if (mostrarCelda) {

        // Eliminar exclusivamente el modelo del cubo

        viewer.removeModel(modeloCelda);

        modeloCelda = null;

        this.textContent = "Mostrar celda unidad";

    } else {

        // Reconstruir exclusivamente el cubo

        modeloCelda = crearCelda();

        this.textContent = "Ocultar celda unidad";

    }

    mostrarCelda = !mostrarCelda;

    viewer.render();

};

</script>

</body>
</html>
